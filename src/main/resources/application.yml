server:
  address: 127.0.0.1
  port: ${PORT:8788}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      timeout: 30m
      cookie:
        name: WORKBENCH_SESSION
        http-only: true
        same-site: strict
        secure: ${WORKBENCH_SECURE_COOKIE:false}
spring:
  datasource:
    url: ${WORKBENCH_DB_URL:jdbc:mysql://127.0.0.1:3306/soongo_aftersales_java}
    username: ${WORKBENCH_DB_USER}
    password: ${WORKBENCH_DB_PASSWORD}
  flyway:
    clean-disabled: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
